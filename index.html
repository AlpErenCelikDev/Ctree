<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutlu Yıllar!</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: monospace; 
            white-space: pre;       
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #console {
            font-size: 18px;
            line-height: 1.2;
        }
        #baslat-butonu {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #333;
            color: #fff;
            border: 2px solid white;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        /* C RENK FIRÇALARI */
        .green { color: #00FF00; }
        .red { color: #FF0000; }
        .yellow { color: #FFFF00; }
        .cyan { color: #00FFFF; }
        .magenta { color: #FF00FF; }
        .brown { color: #A52A2A; }

        /* SÖZLER İÇİN YENİ STİLLER (Spotify Tarzı) */
        #lyrics-container {
            margin-top: 40px;
            height: 80px; /* 2 satır görünecek kadar alan (satır başı 40px) */
            overflow: hidden;
            position: relative;
            width: 90%;
            max-width: 600px;
            text-align: center;
            font-family: 'Arial', sans-serif; /* Ağaçtan farklı, daha okunaklı modern font */
            font-size: 22px;
            font-weight: bold;
            /* Üstten ve alttan silikleşme (fade) efekti */
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
        }
        #lyrics-scroll {
            transition: transform 0.4s ease-out; /* Pürüzsüz kayma animasyonu */
        }
        .lyric-line {
            height: 40px;
            line-height: 40px;
            opacity: 0.2; /* Aktif olmayanlar silik ve beyaz */
            color: white;
            transition: all 0.3s ease;
        }
        .lyric-line.active {
            opacity: 1;
            transform: scale(1.15); /* Aktif olan satır hafif büyür ve öne çıkar */
            /* Renk değişimi JS içinden dinamik yapılacak */
        }
    </style>
</head>
<body>

    <button id="baslat-butonu" onclick="baslat()">Ağacı ve Müziği Başlat</button>
    
    <div id="console" style="display:none;"></div>
    
    <!-- YENİ: Sözlerin Görüneceği Kayan Alan -->
    <div id="lyrics-container" style="display:none;">
        <div id="lyrics-scroll"></div>
    </div>
    
    <!-- Şarkı Dosyan -->
    <audio id="muzik" src="muzik.wav" loop></audio>

    <script>
        // ZAMANLARI SANİYEYE ÇEVİREN YARDIMCI FONKSİYON 
        // (Senin 1.10 veya 0.055 gibi yazılarını JS'nin anlayacağı tam saniyeye çevirir)
        function saniyeYap(zaman) {
            let dakika = Math.floor(zaman);
            let saniye = (zaman - dakika) * 100;
            return (dakika * 60) + saniye;
        }

        // SÖZLER VE ZAMANLARI LİSTESİ
        // İlk 4 satırı örnek olarak ekledim. Kendi listendeki geri kalan tüm sözleri
        // tamamen aynı formatta kopyalayıp alt alta buraya yapıştırabilirsin.
        const sarkisozleri = [
            { time: saniyeYap(0.01), text: "I mean, where the fuck should I really even start?" },
            { time: saniyeYap(0.03), text: "I got hoes that I′m keepin' in the dark" },
            { time: saniyeYap(0.055), text: "I got my niggas ′cross the street living large" },
            { time: saniyeYap(0.08), text: "Thinking back to the fact that they dead" },
            // KENDİ LİSTENİN DEVAMINI BURAYA EKLE:
            // { time: saniyeYap(0.09), text: "Thought my raps wasn't facts 'til they sat with the bars" },
            // ...
        ];

        // Sözleri Kutuya Yerleştirme
        const scrollKutusu = document.getElementById('lyrics-scroll');
        sarkisozleri.forEach((satir, index) => {
            let div = document.createElement('div');
            div.className = 'lyric-line';
            div.id = 'lyric-' + index;
            div.innerText = satir.text;
            scrollKutusu.appendChild(div);
        });

        const renkler = ['#00FF00', '#FF0000', '#FFFF00', '#00FFFF', '#FF00FF', '#1DB954']; 
        let aktifIndex = -1;
        const muzik = document.getElementById('muzik');

        // Şarkı çalarken sürekli süreyi kontrol edip sözleri kaydıran sistem
        muzik.addEventListener('timeupdate', () => {
            let suAnkiZaman = muzik.currentTime;
            
            let yeniIndex = -1;
            for(let i = 0; i < sarkisozleri.length; i++) {
                if(suAnkiZaman >= sarkisozleri[i].time) {
                    yeniIndex = i;
                } else {
                    break;
                }
            }

            // Aktif satır değiştiğinde çalışır
            if(yeniIndex !== aktifIndex && yeniIndex !== -1) {
                // 1. Eski satırı sönükleştir
                if(aktifIndex !== -1) {
                    let eskiSatir = document.getElementById('lyric-' + aktifIndex);
                    if(eskiSatir) {
                        eskiSatir.classList.remove('active');
                        eskiSatir.style.color = 'white'; 
                    }
                }
                
                // 2. Yeni satırı parlat, büyüt ve ağaçtaki renklerden birine boya
                let yeniSatir = document.getElementById('lyric-' + yeniIndex);
                if(yeniSatir) {
                    yeniSatir.classList.add('active');
                    let rastgeleRenk = renkler[Math.floor(Math.random() * renkler.length)];
                    yeniSatir.style.color = rastgeleRenk;
                }

                // 3. Spotify Tarzı Kaydırma (Scroll)
                // Kutu 80px (2 satır) olduğu için aktif satırı tam ortalamak adına hesaplama yapıyoruz
                let kaydirmaMiktari = (yeniIndex * 40) - 20; 
                if(kaydirmaMiktari < 0) kaydirmaMiktari = 0;
                scrollKutusu.style.transform = `translateY(-${kaydirmaMiktari}px)`;
                
                aktifIndex = yeniIndex;
            }
        });

        // BAŞLATMA FONKSİYONU
        function baslat() {
            document.getElementById('baslat-butonu').style.display = 'none';
            document.getElementById('console').style.display = 'block';
            document.getElementById('lyrics-container').style.display = 'block'; // Sözleri görünür yap
            muzik.play();
            
            setInterval(tree, 300); // Çam ağacı animasyonunu başlat
        }

        // AĞAÇ ÇİZİM FONKSİYONU (Aynı kalıyor)
        function tree() {
            let html = "";
            html += "               <span class='yellow'>*</span>\n";
            for (let i = 0; i < 15; i++) {
                for(let k = 15 - i; k > 0; k--) html += " ";
                for (let j = 1; j <= (2*i + 1); j++) {
                    let luck = Math.floor(Math.random() * 15);
                    if (luck === 0) html += "<span class='red'>*</span>";
                    else if (luck === 1) html += "<span class='yellow'>*</span>";
                    else if (luck === 2) html += "<span class='cyan'>*</span>";
                    else if (luck === 3) html += "<span class='magenta'>*</span>";
                    else html += "<span class='green'>^</span>";
                }
                html += "\n";
            }
            for(let j = 0; j < 4; j++) {
                html += "             <span class='brown'>=====</span>\n";
            }
            document.getElementById('console').innerHTML = html;
        }
    </script>
</body>
</html>
