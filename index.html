<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mutlu Yıllar!</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --pixel: 'Press Start 2P', 'Courier New', monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b0b1a; /* düz renk */
    color: #fff;
    font-family: var(--pixel);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
    image-rendering: pixelated;
  }
  #kar { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  #baslat-butonu {
    font-family: var(--pixel); font-size: 14px; padding: 18px 22px; cursor: pointer;
    background: #e63946; color: #fff; border: 4px solid #fff; border-radius: 0;
    box-shadow: 6px 6px 0 #000; text-transform: uppercase; z-index: 2;
  }
  #baslat-butonu:active { transform: translate(3px,3px); box-shadow: 3px 3px 0 #000; }

  #giris { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 92%; max-width: 640px; z-index: 2; }
  #giris p { font-size: 9px; line-height: 1.8; text-align: center; color: #bbb; margin: 0; }
  #soz-girdi {
    width: 100%; height: 38vh; resize: vertical; background: #000; color: #00ff55;
    border: 4px solid #fff; border-radius: 0; padding: 10px; font-family: monospace; font-size: 14px;
  }
  #sahne { display: none; flex-direction: column; align-items: center; z-index: 1; width: 100%; }
  #console {
    white-space: pre; font-family: monospace; font-size: 18px; line-height: 1.2;
  }
  .green { color: #00FF00; } .red { color: #FF0000; } .yellow { color: #FFFF00; }
  .cyan { color: #00FFFF; } .magenta { color: #FF00FF; } .brown { color: #A52A2A; }

  /* SÖZLER */
  #sozler {
    margin-top: 22px; width: 94%; max-width: 820px; min-height: 120px;
    text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center;
    font-family: var(--pixel);
  }
  .grup { transition: opacity .25s; }
  .grup.onceki, .grup.sonraki { opacity: .22; font-size: 9px; }
  .grup.onceki .kelime, .grup.sonraki .kelime { color: #8a8aa0 !important; }
  .grup.simdi { font-size: clamp(11px, 2.4vw, 17px); line-height: 1.7; }
  .kelime {
    display: inline-block; margin: 0 .3em; text-shadow: 3px 3px 0 #000;
    animation: pop .25s steps(3) both;
  }
  @keyframes pop { from { transform: translateY(-8px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  #alt-kutu { width: 94%; max-width: 820px; min-height: 80px; margin-top: 6px; text-align: center; }
  .alt-soz {
    margin-top: 8px; line-height: 1.7;
    font-size: clamp(13px, 2.9vw, 20px); /* ana sözden büyük */
    color: #ffd6f0;
    text-shadow: 3px 3px 0 #000, 0 0 14px #ff4df0, 0 0 28px #ff4df0aa;
    animation: pop .3s steps(3) .15s both;
  }

  /* 8-bit ilerleme çubuğu */
  #bar-kap { margin-top: 18px; width: 80%; max-width: 480px; height: 14px; border: 3px solid #fff; background: #000; }
  #bar { height: 100%; width: 0; background: repeating-linear-gradient(90deg,#00ff55 0 8px,#00c040 8px 10px); }
</style>
</head>
<body>

<canvas id="kar"></canvas>

<div id="giris">
  <p id="giris-yardim">Sözleri aşağıya yapıştır (her satır: zaman söz, ör. 0.01 ilk satır).<br>
  Zaman damgası ayrı satırda, söz altında olsa da olur.<br>
  Parantezle başlayan satırlar alt söz olur.</p>
  <textarea id="soz-girdi" spellcheck="false" placeholder="0.01 ..."></textarea>
  <button id="baslat-butonu" onclick="baslat()">&#9654; Başlat</button>
</div>

<div id="sahne">
  <div id="console"></div>
  <div id="sozler"></div>
  <div id="alt-kutu"></div>
  <div id="bar-kap"><div id="bar"></div></div>
</div>

<audio id="muzik" src="muzik.wav" loop></audio>

<script>

const HAM_SOZLER = `
0.01 I mean, where the fuck should I really even start?
0.03 I got hoes that I′m keepin' in the dark
0.055 I got my niggas ′cross the street living large
0.08 Thinking back to the fact that they dead
0.09 Thought my raps wasn't facts 'til they sat with the bars
0.125 I got two phones, one need to charge
0.15 Yeah, they twins, I could tell they ass apart
0.17 I got big packs coming on the way
0.19 I got big stacks coming out the safe (last Christmas)

0.20 (Last Christmas, I gave you my heart)
0.25 (But the very next day, you gave it away, gave it away)
0.30 (This year, to save me from tears)
0.34 (I′ll give it to someone special)


0.21 I got Lil Max with me, he the wave 
0.23 It′s a big gap between us in the game 
0.26 In the next life, I′m tryna stay paid 
0.28 When I die, put my money in the grave 
   
0.31 When I die, put my money in the grave
0.33 I really gotta put a couple niggas in they place
0.35 Really just lapped...

0.36 I mean, where the fuck should I really even start?
0.39 I got hoes that I′m keepin' in the dark
0.415 I got my niggas ′cross the street living large
0.44  Thinking back to the fact that they dead
0.45 Thought my raps wasn't facts 'til they sat with the bars
0.485 I got two phones, one need to charge
0.51 Yeah, they twins, I could tell they ass apart
0.53 I got big packs coming on the way
0.55 I got big stacks coming out the safe (last Christmas)

0.57 I got Lil Max with me, he the wave
0.59 It′s a big gap between us in the game
1.02 In the next life, I′m tryna stay paid
1.04 When I die, put my money in the grave

1.07 When I die, put my money in the grave
1.09 I really gotta put a couple niggas in they place
1.11 Really just lapped...

0.56 (Last Christmas, I gave you my heart)
1.01 (But the very next day, you gave it away, gave it away)
1.06 (This year, to save me from tears)
1.10 (I′ll give it to someone special)


`;

const SARKI_SURESI = 78;

(function () {
  const girdi = document.getElementById('soz-girdi');
  const yardim = document.getElementById('giris-yardim');
  if (HAM_SOZLER.trim()) {
    // Sözler kodun içinde hazır: ziyaretçiye sadece Başlat butonu görünür
    girdi.style.display = 'none';
    yardim.style.display = 'none';
  } else {
    let kayitli = '';
    try { kayitli = localStorage.getItem('mutluyillar-sozler') || ''; } catch (e) {}
    girdi.value = kayitli;
  }
})(); // 1 dk 18 sn

/* ---------- Zaman çevirici: "1.10" -> 70, "0.055" -> 5.5 ---------- */
function zamanCevir(s) {
  const [d, kalan = ""] = s.split(".");
  const sn = parseInt((kalan + "00").slice(0, 2), 10);
  const kesir = kalan.length >= 3 ? parseInt(kalan[2], 10) / 10 : 0;
  return parseInt(d, 10) * 60 + sn + kesir;
}

/* ---------- Ham metni ayrıştır + alt sözleri doğru satıra bağla ---------- */
function sozleriHazirla(ham) {
  const ana = [], alt = [];
  let bekleyen = null; // zaman damgası ayrı satırdaysa söz bir sonraki satırdadır
  ham.split(/\r?\n/).forEach(satir => {
    const t = satir.trim();
    if (!t) return;
    let m = t.match(/^(\d+\.\d+)\s+(.+)$/);
    let zaman = null, metin = null;
    if (m) { zaman = zamanCevir(m[1]); metin = m[2]; }
    else if (/^\d+\.\d+$/.test(t)) { bekleyen = zamanCevir(t); return; }
    else if (bekleyen !== null) { zaman = bekleyen; metin = t; }
    else return;
    bekleyen = null;
    const kayit = { time: zaman, text: metin };
    (metin.startsWith("(") ? alt : ana).push(kayit);
  });
  // Ana sözler ve parantezli sözler iki AYRI akış: her biri kendi zamanında akar
  ana.sort((a, b) => a.time - b.time);
  alt.sort((a, b) => a.time - b.time);
  return { ana, alt };
}

let gruplar = [];
let altlar = [];
const ALT_SURE = 6; // alt söz en fazla kaç saniye ekranda kalsın

/* ---------- Kelime renkleri ---------- */
const renkler = ['#ffffff', '#ff3b3b', '#ffe600', '#00f0ff', '#ff4df0', '#00ff55',
                 '#ff9f1c', '#9d7bff', '#ff6f91', '#4dff9f', '#4d9bff', '#c6ff00'];

function grupOlustur(g, idx, durum) {
  const kap = document.createElement('div');
  kap.className = 'grup ' + durum;
  const ana = document.createElement('div');
  g.text.split(/\s+/).forEach((k, i) => {
    const s = document.createElement('span');
    s.className = 'kelime';
    s.textContent = k;
    s.style.color = renkler[(i + idx) % renkler.length];
    if (durum === 'simdi') s.style.animationDelay = (i * 0.07) + 's';
    ana.appendChild(s);
  });
  kap.appendChild(ana);
  if (g.sub && durum === 'simdi') {
    const a = document.createElement('div');
    a.className = 'alt-soz';
    a.textContent = g.sub;
    kap.appendChild(a);
  }
  return kap;
}

const sozKutu = document.getElementById('sozler');
let aktif = -2;
let altAktif = -2;

function sozleriCiz(idx) {
  sozKutu.innerHTML = '';
  if (idx > 0) sozKutu.appendChild(grupOlustur(gruplar[idx - 1], idx - 1, 'onceki'));
  if (idx >= 0) sozKutu.appendChild(grupOlustur(gruplar[idx], idx, 'simdi'));
  const sonraki = idx + 1;
  if (sonraki < gruplar.length) sozKutu.appendChild(grupOlustur(gruplar[sonraki], sonraki, 'sonraki'));
}

/* ---------- Müzikle senkron döngü ---------- */
const muzik = document.getElementById('muzik');
const bar = document.getElementById('bar');

function dongu() {
  const t = muzik.currentTime;
  let yeni = -1;
  for (let i = 0; i < gruplar.length; i++) {
    if (t >= gruplar[i].time) yeni = i; else break;
  }
  if (yeni !== aktif) { aktif = yeni; sozleriCiz(yeni); }
  // Pembe alt sözler: ana akıştan bağımsız, kendi zaman damgalarıyla
  let yeniAlt = -1;
  for (let i = 0; i < altlar.length; i++) {
    if (t >= altlar[i].time) yeniAlt = i; else break;
  }
  if (yeniAlt !== -1 && t > altlar[yeniAlt].time + ALT_SURE) yeniAlt = -1;
  if (yeniAlt !== altAktif) {
    altAktif = yeniAlt;
    const kutu = document.getElementById('alt-kutu');
    kutu.innerHTML = '';
    if (yeniAlt !== -1) {
      const d = document.createElement('div');
      d.className = 'alt-soz';
      d.textContent = altlar[yeniAlt].text;
      kutu.appendChild(d);
    }
  }
  const toplam = isFinite(muzik.duration) && muzik.duration > 0 ? muzik.duration : SARKI_SURESI;
  bar.style.width = Math.min(100, (t / toplam) * 100) + '%';
  requestAnimationFrame(dongu);
}

/* ---------- Başlat ---------- */
function baslat() {
  const girdi = document.getElementById('soz-girdi');
  const kaynak = HAM_SOZLER.trim() ? HAM_SOZLER : girdi.value;
  const akis = sozleriHazirla(kaynak);
  gruplar = akis.ana;
  altlar = akis.alt;
  if (!gruplar.length) { alert('Söz bulunamadı. HAM_SOZLER içine (ters tırnak ` ` arasına) "0.01 söz" biçiminde ekle.'); return; }
  if (!HAM_SOZLER.trim()) { try { localStorage.setItem('mutluyillar-sozler', girdi.value); } catch (e) {} }
  aktif = -2;
  altAktif = -2;
  document.getElementById('giris').style.display = 'none';
  document.getElementById('sahne').style.display = 'flex';
  muzik.play();
  tree();
  setInterval(tree, 300);
  requestAnimationFrame(dongu);
}

/* ---------- Ağaç (orijinal, değiştirilmedi) ---------- */
function tree() {
    let html = "";
    html += "               <span class='yellow'>*</span>\n";
    for (let i = 0; i < 15; i++) {
        for(let k = 15 - i; k > 0; k--) html += " ";
        for (let j = 1; j <= (2*i + 1); j++) {
            let luck = Math.floor(Math.random() * 15);
            if (luck === 0) html += "<span class='red'>*</span>";
            else if (luck === 1) html += "<span class='yellow'>*</span>";
            else if (luck === 2) html += "<span class='cyan'>*</span>";
            else if (luck === 3) html += "<span class='magenta'>*</span>";
            else html += "<span class='green'>^</span>";
        }
        html += "\n";
    }
    for(let j = 0; j < 4; j++) {
        html += "             <span class='brown'>=====</span>\n";
    }
    document.getElementById('console').innerHTML = html;
}

/* ---------- Kar yağışı (piksel kar taneleri) ---------- */
const kanvas = document.getElementById('kar');
const ctx = kanvas.getContext('2d');
let taneler = [];
function karBoyutla() {
  kanvas.width = innerWidth; kanvas.height = innerHeight;
  taneler = Array.from({ length: Math.floor(innerWidth / 12) }, () => ({
    x: Math.random() * kanvas.width,
    y: Math.random() * kanvas.height,
    boy: Math.random() < 0.3 ? 6 : 3,
    hiz: 0.6 + Math.random() * 1.4,
    salinim: Math.random() * Math.PI * 2
  }));
}
function karCiz() {
  ctx.clearRect(0, 0, kanvas.width, kanvas.height);
  ctx.fillStyle = '#ffffff';
  taneler.forEach(t => {
    t.y += t.hiz;
    t.salinim += 0.02;
    t.x += Math.sin(t.salinim) * 0.4;
    if (t.y > kanvas.height) { t.y = -6; t.x = Math.random() * kanvas.width; }
    ctx.fillRect(Math.round(t.x), Math.round(t.y), t.boy, t.boy);
  });
  requestAnimationFrame(karCiz);
}
addEventListener('resize', karBoyutla);
karBoyutla();
karCiz();
</script>
</body>
</html>
